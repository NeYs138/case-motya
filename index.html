<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarCase — CS2</title>
<style>
:root{--bg:#0d0d12;--sf:#16161f;--sf2:#1e1e2a;--tx:#fff;--mu:#8a8a9e;--ac:#ffcc00;--bd:#2a2a3a;--ok:#3ee0a8;--red:#ff5252}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:none}
header{display:flex;align-items:center;gap:20px;padding:12px 20px;background:var(--sf);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;color:var(--ac)}
nav{display:flex;gap:4px;flex:1}
nav a{padding:8px 14px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:600}
nav a.on,nav a:hover{background:var(--sf2);color:var(--tx)}
.bal{display:flex;gap:10px;background:var(--sf2);padding:6px 14px;border-radius:20px;font-weight:700}
.bal b{color:var(--ac)}
.btn{background:var(--ac);color:#000;padding:8px 16px;border-radius:8px;font-weight:700}
.btn:hover{opacity:.9}
.view{display:none;padding:20px;max-width:1100px;margin:0 auto}
.view.on{display:block}
h1{font-size:24px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.case-card{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:.2s}
.case-card:hover{border-color:var(--ac);transform:translateY(-3px)}
.case-card img{width:100%;height:100px;object-fit:contain}
.case-card .nm{font-weight:700;margin:8px 0 4px;font-size:13px}
.case-card .pr{color:var(--ac);font-weight:800}
.inv-item{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.inv-item img{width:100%;height:70px;object-fit:contain}
.inv-item .nm{font-size:11px;margin:6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-item .pr{color:var(--ac);font-weight:700;font-size:12px}
.btn-sell{background:var(--ok);color:#000;width:100%;padding:5px;border-radius:6px;font-size:11px;font-weight:700;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.on{display:flex}
.modal-c{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:700px}
.roll-box{position:relative;height:140px;overflow:hidden;background:var(--sf2);border-radius:10px;margin:16px 0}
.roll-strip{display:flex;position:absolute;left:0;transition:transform 4.5s cubic-bezier(.1,.8,.2,1)}
.roll-item{width:110px;height:110px;flex-shrink:0;margin:15px 8px;background:var(--sf);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--bd)}
.roll-item img{width:70px;height:70px;object-fit:contain}
.roll-item span{font-size:9px;text-align:center;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;padding:0 4px}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--ac);transform:translateX(-50%);z-index:5;box-shadow:0 0 10px var(--ac)}
.upg-layout{display:grid;grid-template-columns:260px 1fr 300px;gap:16px}
@media(max-width:800px){.upg-layout{grid-template-columns:1fr}}
.upg-list{background:var(--sf);border-radius:12px;padding:12px;max-height:500px;overflow-y:auto}
.upg-list .it{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.upg-list .it:hover,.upg-list .it.sel{border-color:var(--ac);background:rgba(255,204,0,.05)}
.upg-list .it img{width:40px;height:40px;object-fit:contain}
.upg-center{background:var(--sf);border-radius:12px;padding:20px;text-align:center}
.circle{width:180px;height:180px;margin:0 auto;position:relative}
.circle svg{transform:rotate(-90deg)}
.circle .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--ac)}
.upg-btn{background:var(--ac);color:#000;padding:14px 30px;border-radius:10px;font-size:18px;font-weight:800;width:100%;max-width:280px;margin-top:16px}
.upg-btn:disabled{background:var(--sf2);color:var(--mu)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--ac);padding:10px 20px;border-radius:10px;display:none;z-index:200}
</style>
</head>
<body>
<header>
  <div class="logo">✦ StarCase</div>
  <nav>
    <a href="#cases" onclick="nav('cases')" class="on">Кейсы</a>
    <a href="#inventory" onclick="nav('inventory')">Инвентарь</a>
    <a href="#upgrade" onclick="nav('upgrade')">Апгрейд</a>
  </nav>
  <div class="bal">₽ <b id="bal">0</b> <button class="btn" onclick="addBal()">+</button></div>
</header>

<!-- КЕЙСЫ -->
<div id="cases" class="view on">
  <h1>Кейсы CS2</h1>
  <div class="grid" id="caseGrid"></div>
</div>

<!-- ИНВЕНТАРЬ -->
<div id="inventory" class="view">
  <h1>Инвентарь</h1>
  <div class="grid" id="invGrid"></div>
</div>

<!-- АПГРЕЙД -->
<div id="upgrade" class="view">
  <h1>Апгрейд</h1>
  <div class="upg-layout">
    <div class="upg-list" id="upgInv"></div>
    <div class="upg-center">
      <div class="circle">
        <svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="80" fill="none" stroke="#2a2a3a" stroke-width="10"/><circle id="arc" cx="90" cy="90" r="80" fill="none" stroke="var(--ac)" stroke-width="10" stroke-dasharray="502" stroke-dashoffset="502"/></svg>
        <div class="pct" id="pct">0%</div>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--mu)">Выбрано: <span id="selInfo">ничего</span></div>
      <button class="upg-btn" id="upgBtn" disabled onclick="doUpg()">Улучшить</button>
    </div>
    <div class="upg-list" id="targetList"></div>
  </div>
</div>

<!-- МОДАЛКА РУЛЕТКИ -->
<div class="modal" id="mRoll">
  <div class="modal-c">
    <h2 style="text-align:center;color:var(--ac)">Открытие...</h2>
    <div class="roll-box">
      <div class="marker"></div>
      <div class="roll-strip" id="strip"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- ДАННЫЕ ---
const SKINS = [
  {n:"AK-47 | Redline",p:1600,i:"https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvR6a2xbQUtzDxJSpKz3Yl9j18b3f7iPmqzWzIGZk6qqZ7eJlDoBsZ0o3LiTpo2s3Fbs_0VvMWj0dYXEJgY4c0u9Nw/360fx360f"},
  {n:"AWP | Asiimov",p:5300,i:"https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvR6a2xbQUtzDxJSpKz3Yl9j18b3f7iPmqzWzIGZk6qqZ7eJlDoBsZ0o3LiTpo2s3Fbs_0VvMWj0dYXEJgY4c0u9Nw/360fx360f"},
  {n:"M4A1-S | Printstream",p:9300,i:"https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvR6a2xbQUtzDxJSpKz3Yl9j18b3f7iPmqzWzIGZk6qqZ7eJlDoBsZ0o3LiTpo2s3Fbs_0VvMWj0dYXEJgY4c0u9Nw/360fx360f"},
  {n:"★ Butterfly | Fade",p:142600,i:"https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvR6a2xbQUtzDxJSpKz3Yl9j18b3f7iPmqzWzIGZk6qqZ7eJlDoBsZ0o3LiTpo2s3Fbs_0VvMWj0dYXEJgY4c0u9Nw/360fx360f"}
];
const CASES = [
  {id:1,n:"Starter",p:500,items:[0,1,2]},
  {id:2,n:"Premium",p:2000,items:[0,2,3]}
];
let bal = 10000;
let inv = []; // {n,p,i}
let selIdx = -1, selTarget = null;

// --- УТИЛИТЫ ---
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ru-RU');
const toast = m => { const t=$("toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none",2000); };

// --- НАВИГАЦИЯ ---
function nav(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  $(v).classList.add('on');
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+v));
  if(v==='upgrade') renderUpg();
}

// --- РЕНДЕР ---
function render(){
  $("bal").textContent = fmt(bal);
  // Кейсы
  $("caseGrid").innerHTML = CASES.map(c=>{
    return `<div class="case-card" onclick="openCase(${c.id})">
      <img src="https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvR6a2xbQUtzDxJSpKz3Yl9j18b3f7iPmqzWzIGZk6qqZ7eJlDoBsZ0o3LiTpo2s3Fbs_0VvMWj0dYXEJgY4c0u9Nw/360fx360f">
      <div class="nm">${c.n}</div><div class="pr">${fmt(c.p)} ₽</div>
    </div>`;
  }).join('');
  // Инвентарь
  $("invGrid").innerHTML = inv.length ? inv.map((it,i)=>`
    <div class="inv-item"><img src="${it.i}"><div class="nm">${it.n}</div><div class="pr">${fmt(it.p)} ₽</div>
    <button class="btn-sell" onclick="sell(${i})">Продать</button></div>
  `).join('') : '<p style="color:var(--mu)">Пусто</p>';
}

// --- КЕЙС ---
function openCase(id){
  const c = CASES.find(x=>x.id===id);
  if(bal < c.p){ toast("Мало денег"); return; }
  bal -= c.p;
  const win = SKINS[c.items[Math.floor(Math.random()*c.items.length)]];
  inv.push(win);
  save(); render();
  // Рулетка
  const strip = $("strip");
  let html = '';
  for(let i=0;i<40;i++){
    const s = i===35 ? win : SKINS[Math.floor(Math.random()*SKINS.length)];
    html += `<div class="roll-item"><img src="${s.i}"><span>${s.n}</span></div>`;
  }
  strip.innerHTML = html;
  strip.style.transition='none'; strip.style.transform='translateX(0)';
  $("mRoll").classList.add('on');
  setTimeout(()=>{
    const w = $("roll-box")?.offsetWidth || 700;
    strip.style.transition='transform 4.5s cubic-bezier(.1,.8,.2,1)';
    strip.style.transform=`translateX(${-(35*126) + w/2 - 55}px)`;
  },50);
  setTimeout(()=>{ $("mRoll").classList.remove('on'); toast("Выпало: "+win.n); }, 4800);
}

function sell(i){
  bal += inv[i].p; inv.splice(i,1); save(); render();
}

// --- АПГРЕЙД ---
function renderUpg(){
  $("upgInv").innerHTML = inv.length ? inv.map((it,i)=>`
    <div class="it ${selIdx===i?'sel':''}" onclick="pickSrc(${i})">
      <img src="${it.i}"><div><div style="font-size:11px">${it.n}</div><div style="color:var(--ac);font-size:12px;font-weight:700">${fmt(it.p)} ₽</div></div>
    </div>
  `).join('') : '<p style="color:var(--mu)">Пусто</p>';
  $("targetList").innerHTML = SKINS.map((s,i)=>`
    <div class="it ${selTarget===i?'sel':''}" onclick="pickTgt(${i})">
      <img src="${s.i}"><div><div style="font-size:11px">${s.n}</div><div style="color:var(--ac);font-size:12px;font-weight:700">${fmt(s.p)} ₽</div></div>
    </div>
  `).join('');
  updatePct();
}

function pickSrc(i){ selIdx=i; renderUpg(); }
function pickTgt(i){ selTarget=i; renderUpg(); }

function updatePct(){
  if(selIdx<0 || selTarget===null){ $("pct").textContent="0%"; $("upgBtn").disabled=true; $("selInfo").textContent="ничего"; return; }
  const src = inv[selIdx], tgt = SKINS[selTarget];
  const chance = Math.min(90, Math.max(1, Math.round((src.p / tgt.p)*100)));
  $("pct").textContent = chance+"%";
  $("upgBtn").disabled = false;
  $("selInfo").textContent = src.n + " → " + tgt.n;
  const arc = $("arc");
  arc.style.strokeDashoffset = 502 - (chance/100)*502;
}

function doUpg(){
  if(selIdx<0 || selTarget===null) return;
  const src = inv[selIdx], tgt = SKINS[selTarget];
  const chance = Math.min(90, Math.max(1, (src.p / tgt.p)*100));
  const win = Math.random()*100 <= chance;
  inv.splice(selIdx,1);
  if(win){ inv.push(tgt); toast("Успех! Получен "+tgt.n); }
  else { toast("Провал! Скин сгорел"); }
  selIdx=-1; selTarget=null; save(); render(); renderUpg();
}

// --- СОХРАНЕНИЕ ---
function save(){ try{ localStorage.setItem('sc', JSON.stringify({bal,inv})); }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem('sc')); if(d){ bal=d.bal; inv=d.inv; } }catch(e){} }

function addBal(){ bal+=10000; save(); render(); toast("+10 000 ₽"); }

// --- СТАРТ ---
load(); render();
</script>
</body>
</html>
